<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b36ad" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e18" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="PYPA Marking System — competition registration, live judging and result computation." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Lora (display/headings, chest numbers, marks) paired with Manrope (body,
      UI). Loaded from Google Fonts rather than self-hosted: every screen that
      needs to work fully offline (JDG mark entry, FSD 6.8) is reached only
      after a normal online session load, by which point the browser has
      already cached these files — the offline guarantee never depends on
      this request succeeding mid-session.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <title>PYPA Marking System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
