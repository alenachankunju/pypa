# Netlify configuration for the PYPA Marking System API.
#
# The frontend deploys separately to Vercel; this site serves only /api.

[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Netlify sets NODE_ENV=production, which makes npm skip devDependencies —
  # and the build command needs typescript from there. Install them anyway.
  NPM_FLAGS = "--include=dev"
  # Native modules that must not be bundled by esbuild — they load platform
  # binaries at runtime (argon2 for password hashing, sharp for image
  # re-encoding on upload, per FSD 11.2).
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  # pdfmake's PDF engine (@foliojs-fork/pdfkit) pulls in @foliojs-fork/fontkit,
  # which reads a data file (data.trie) via fs.readFileSync at module load —
  # esbuild's bundler doesn't follow that and silently drops it, crashing every
  # report request with ENOENT in production despite working locally. Excluding
  # these three from bundling makes Netlify ship their real node_modules
  # directories as-is instead, asset files included — the same reason argon2/
  # sharp/pg-native are already excluded here.
  external_node_modules = ["@node-rs/argon2", "sharp", "pg-native", "pdfmake", "@foliojs-fork/pdfkit", "@foliojs-fork/fontkit"]
  included_files = ["migrations/**"]

[functions.api]
  # FSD 11.1 budgets 5 seconds for a standard report and 10 for a full-event
  # recomputation, so the default 10-second cap is raised.
  timeout = 26

# Every API path routes to the single Express handler.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
