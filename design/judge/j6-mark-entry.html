<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J6 · Mark entry — PYPA Marking System</title>
<link rel="stylesheet" href="../../frontend/src/styles/base.css">
<link rel="stylesheet" href="../assets/mock.css">
</head>
<body>
<div class="mock-toolbar">
  <div class="row" style="gap:12px;align-items:center">
    <span class="mock-toolbar-id">J6</span>
    <strong>J6 · Mark entry</strong>
  </div>
  <div class="mock-toolbar-actions">
    <a href="../index.html" style="align-self:center">Index</a>
    <button id="mock-theme-toggle" onclick="mockToggleTheme()">Theme: system</button>
  </div>
</div>
<p class="mock-note">JDG-05-01/02/03: context header, stepper + numeric field, quick-pick chips, remarks. Design principle: full cycle under 15s / 4 taps.</p>
<div class="mock-frame ">


<header class="app-header">
  <div class="header-context">
    <strong>Leela Thomas</strong>
    <span>Saturday Morning — Main Stage</span>
  </div>
</header>

<main class="judge-main" style="padding-top:16px">
  <div class="stack-lg">
    <div class="card stack-sm">
      <div class="row-between">
        <span class="eyebrow">Solo Song — Junior Girls</span>
        <span class="badge badge-neutral">Max 10</span>
      </div>
      <div class="chest-number" style="font-size:1.75rem">118 · Sarah John</div>
      <div class="text-sm muted">Zion Church</div>
    </div>
    <div class="stepper">
      <button type="button" class="stepper-btn" aria-label="Decrease">−</button>
      <input class="stepper-value" value="8.5" inputmode="decimal" aria-label="Mark">
      <button type="button" class="stepper-btn" aria-label="Increase">+</button>
    </div>
    <div class="chip-row" role="group" aria-label="Quick marks">
      <button type="button" class="chip">6.0</button>
      <button type="button" class="chip">6.5</button>
      <button type="button" class="chip">7.0</button>
      <button type="button" class="chip">7.5</button>
      <button type="button" class="chip">8.0</button>
      <button type="button" class="chip" aria-pressed="true">8.5</button>
      <button type="button" class="chip">9.0</button>
      <button type="button" class="chip">9.5</button>
      <button type="button" class="chip">10.0</button>
    </div>
    <div class="field">
      <label class="label" for="rem">Remarks (optional, visible to administrators only)</label>
      <textarea id="rem" class="textarea" placeholder="e.g. Strong second verse, slightly rushed ending"></textarea>
    </div>
    <div class="action-dock">
      <button type="button" class="btn btn-primary btn-lg btn-block">Submit mark</button>
    </div>
  </div>
</main>

</div>
<script src="../assets/mock.js"></script>
</body>
</html>
