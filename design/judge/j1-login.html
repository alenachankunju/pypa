<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J1 · Login — PYPA Marking System</title>
<link rel="stylesheet" href="../../frontend/src/styles/base.css">
<link rel="stylesheet" href="../assets/mock.css">
</head>
<body>
<div class="mock-toolbar">
  <div class="row" style="gap:12px;align-items:center">
    <span class="mock-toolbar-id">J1</span>
    <strong>J1 · Login</strong>
  </div>
  <div class="mock-toolbar-actions">
    <a href="../index.html" style="align-self:center">Index</a>
    <button id="mock-theme-toggle" onclick="mockToggleTheme()">Theme: system</button>
  </div>
</div>
<p class="mock-note">ADM-01-01: single shared login screen for every role. Routing after login is by role (ADM-01-02).</p>
<div class="mock-frame ">

<div style="min-height:780px;display:flex;align-items:center;justify-content:center;padding:16px">
  <div class="card stack" style="width:100%">
    <div style="text-align:center">
      <div aria-hidden="true" style="width:56px;height:56px;margin:0 auto 12px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700">P</div>
      <h1 class="page-title">PYPA Marking System</h1>
      <p class="text-sm muted">Sign in to continue</p>
    </div>
    <div class="stack">
      <div class="field">
        <label class="label" for="u">Username</label>
        <input id="u" class="input" value="judge2" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" for="p">Password</label>
        <input id="p" class="input" type="password" value="••••••••" autocomplete="current-password">
      </div>
      <button type="button" class="btn btn-primary btn-lg btn-block">Sign in</button>
    </div>
    <p class="text-xs subtle" style="text-align:center">Forgotten your password? Ask your administrator to reset it.</p>
  </div>
</div>

</div>
<script src="../assets/mock.js"></script>
</body>
</html>
