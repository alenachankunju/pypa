<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J2 · Session selection — PYPA Marking System</title>
<link rel="stylesheet" href="../../frontend/src/styles/base.css">
<link rel="stylesheet" href="../assets/mock.css">
</head>
<body>
<div class="mock-toolbar">
  <div class="row" style="gap:12px;align-items:center">
    <span class="mock-toolbar-id">J2</span>
    <strong>J2 · Session selection</strong>
  </div>
  <div class="mock-toolbar-actions">
    <a href="../index.html" style="align-self:center">Index</a>
    <button id="mock-theme-toggle" onclick="mockToggleTheme()">Theme: system</button>
  </div>
</div>
<p class="mock-note">JDG-01-02: auto-skipped when only one session is open. Shown when a judge is on more than one panel (FSD 12.3).</p>
<div class="mock-frame ">


<header class="app-header">
  <div class="header-context">
    <strong>Leela Thomas</strong>
    <span>No session selected</span>
  </div>
</header>

<main class="judge-main" style="padding-top:16px">
  <div class="stack">
    <h2 class="page-title">Choose a session</h2>
    <div class="stack-sm">
      <button type="button" class="card row-between" style="width:100%;text-align:left">
        <div>
          <div class="strong">Saturday Morning — Main Stage</div>
          <div class="text-sm muted">Main Stage Panel · Main Stage</div>
        </div>
        <span class="badge badge-warning">3 awaiting you</span>
      </button>
      <button type="button" class="card row-between" style="width:100%;text-align:left">
        <div>
          <div class="strong">Saturday Afternoon — Hall B</div>
          <div class="text-sm muted">Quiz Panel · Hall B</div>
        </div>
      </button>
    </div>
    <div class="card">
      <p class="eyebrow" style="margin-bottom:8px">Upcoming sessions</p>
      <div class="stack-sm text-sm">
        <div class="row-between"><span>Sunday Finals — Main Stage</span><span class="muted">Tomorrow, 09:00</span></div>
      </div>
    </div>
  </div>
</main>

</div>
<script src="../assets/mock.js"></script>
</body>
</html>
